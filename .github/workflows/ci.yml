name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DISABLE_PANDERA_IMPORT_WARNING: "True"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check src/ api/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Train model (required before API tests can load it)
        run: python -m src.models.train
      - name: Run test suite with coverage
        run: pytest tests/ -v --cov=src --cov=api --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t breast-cancer-classification:ci .
